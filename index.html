<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loadin</title>
<style>
  @property --p { syntax: "<number>"; inherits: false; initial-value: 0; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
    background: #fff; color: #222; font-family: system-ui, sans-serif;
  }
  #disc {
    --p: 0;
    width: 140px; height: 140px; border-radius: 50%;
    background: conic-gradient(from 0deg, #e00 calc(var(--p) * 1%), #f2d6d6 0);
    transition: --p .12s linear;
  }
  #label { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  #sub { font-size: .8rem; opacity: .6; font-variant-numeric: tabular-nums; }
  .err { color: #b00020; max-width: 80vw; text-align: center; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    #disc { background: conic-gradient(from 0deg, #e00 calc(var(--p) * 1%), #3a2222 0); }
    .err { color: #ff6b6b; }
  }
</style>
</head>
<body>
<div id="disc" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
<div id="label">0%</div>
<div id="sub">0 bytes</div>

<script>
(async function () {
  const PREFIX = "Main.part";   // Main.part01 ... Main.part10
  const COUNT  = 10;
  const STEP   = 100;           // wheel updates every 100 bytes
  const BANK   = 1000;          // every 1000 bytes -> banked into the fill, ticker cleared
  const DESIGN_W = 1100;        // width the page is built for

  const disc  = document.getElementById("disc");
  const label = document.getElementById("label");
  const sub   = document.getElementById("sub");
  const list  = Array.from({ length: COUNT }, (_, i) => PREFIX + String(i + 1).padStart(2, "0"));

  // Injected at the very top of the rebuilt page's <head> so it runs BEFORE the BoxedWine shell reads
  // the screen size. No iframe, no scaling/transforms: the page is left exactly as built. On screens
  // smaller than MIN_W x MIN_H, the page is simply told it is on a bigger screen (same aspect ratio),
  // so it creates its full-size window and its own CSS can crop it down as it normally does.
  const MIN_W = DESIGN_W;   // 1100
  const MIN_H = 0;          // optional minimum height; 0 = keep the device's aspect ratio

  const FIT_SCRIPT = [
    '(function(){',
    'var MIN_W=' + MIN_W + ',MIN_H=' + MIN_H + ';',
    'function orig(o,p){var x=o,d;while(x&&!(d=Object.getOwnPropertyDescriptor(x,p)))x=Object.getPrototypeOf(x);',
    ' if(!d)return function(){return 0;};',
    ' return d.get?function(){return d.get.call(o);}:function(){return d.value;};}',
    'function def(o,p,fn){try{Object.defineProperty(o,p,{configurable:true,get:fn});}catch(e){}}',
    'var rw=orig(window,"innerWidth"),rh=orig(window,"innerHeight");',
    'function f(){var w=rw()||1,h=rh()||1;return Math.max(1,MIN_W/w,MIN_H/h);}',
    'function scaled(g){return function(){return Math.round(g()*f());};}',
    'def(window,"innerWidth",scaled(rw));',
    'def(window,"innerHeight",scaled(rh));',
    'def(window,"outerWidth",scaled(orig(window,"outerWidth")));',
    'def(window,"outerHeight",scaled(orig(window,"outerHeight")));',
    'var S=window.screen;',
    '["width","height","availWidth","availHeight"].forEach(function(k){def(S,k,scaled(orig(S,k)));});',
    'var de=document.documentElement;',
    'def(de,"clientWidth",scaled(orig(de,"clientWidth")));',
    'def(de,"clientHeight",scaled(orig(de,"clientHeight")));',
    'var vv=window.visualViewport;',
    'if(vv){def(vv,"width",scaled(orig(vv,"width")));def(vv,"height",scaled(orig(vv,"height")));}',
    '})();'
  ].join("\n");

  const INJECT = '<meta name="viewport" content="width=' + DESIGN_W + '">' +
                 '<script>' + FIT_SCRIPT + '<\/script>';

  // The size-faking is now OFF by default (the page is run untouched). Add ?spoof=1 to the loader's URL to turn it on.
  const SPOOF = /[?&]spoof=1(?:&|$)/.test(location.search);

  function withFit(html) {
    if (!SPOOF) return html;
    // The page ships its own viewport meta (width=device-width); a second one would override ours,
    // so drop the original (it lives near the top, so only look there).
    const HEAD = 20000;
    html = html.slice(0, HEAD).replace(/<meta[^>]*name=["']viewport["'][^>]*>/i, "") + html.slice(HEAD);
    if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, (m) => m + INJECT);
    if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, (m) => m + "<head>" + INJECT + "</head>");
    return INJECT + html;
  }

  function fail(msg) {
    label.className = "err";
    label.textContent = msg + " — serve this folder over http (not file://).";
    sub.textContent = "";
  }

  try {
    // 1) Learn total size so the wheel can reach exactly 100%
    const sizes = await Promise.all(list.map(async (n) => {
      const r = await fetch(n, { method: "HEAD", cache: "no-store" });
      if (!r.ok) throw new Error(n + " failed (HTTP " + r.status + ")");
      return parseInt(r.headers.get("Content-Length"), 10) || 0;
    }));
    const total = sizes.reduce((a, b) => a + b, 0);

    // 2) Byte ticker: never grows past BANK. Each full BANK moves into `banked`, ticker resets.
    let ticker = 0;   // bytes since last bank (0..999)
    let banked = 0;   // bytes already folded into the fill (multiples of BANK)

    function addBytes(n) {
      ticker += n;
      while (ticker >= BANK) { banked += BANK; ticker -= BANK; }
      render(banked + Math.floor(ticker / STEP) * STEP);   // wheel moves in 100-byte steps
    }

    function render(bytes) {
      const pct = total ? Math.min(100, (bytes / total) * 100) : 0;
      disc.style.setProperty("--p", pct.toFixed(2));
      disc.setAttribute("aria-valuenow", Math.round(pct));
      label.textContent = Math.round(pct) + "%";
      sub.textContent = bytes.toLocaleString() + (total ? " / " + total.toLocaleString() : "") + " bytes";
    }

    // 3) Stream every part, feeding the ticker as chunks arrive
    const parts = await Promise.all(list.map(async (n) => {
      const r = await fetch(n, { cache: "no-store" });
      if (!r.ok) throw new Error(n + " failed (HTTP " + r.status + ")");
      const reader = r.body.getReader();
      const chunks = [];
      let len = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); len += value.length;
        addBytes(value.length);
      }
      const out = new Uint8Array(len);
      let o = 0; for (const c of chunks) { out.set(c, o); o += c.length; }
      return out;
    }));

    // 4) Join bytes in order, decode once (safe for splits mid UTF-8 character)
    const all = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
    let off = 0; for (const p of parts) { all.set(p, off); off += p.length; }
    const html = new TextDecoder("utf-8").decode(all);

    render(total || all.length);
    if (!total) disc.style.setProperty("--p", 100);
    await new Promise((res) => setTimeout(res, 400));

    // 5) Run it directly in this document (no iframe)
    document.open();
    document.write(withFit(html));
    document.close();
  } catch (err) {
    fail(err.message);
  }
})();
</script>
</body>
</html>
