<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<style>
  @property --p { syntax: "<number>"; inherits: false; initial-value: 0; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
    background: #fff; color: #222; font-family: system-ui, sans-serif;
  }
  #disc {
    --p: 0;
    width: 140px; height: 140px; border-radius: 50%;
    background: conic-gradient(from 0deg, #e00 calc(var(--p) * 1%), #f2d6d6 0);
    transition: --p .35s ease-out;
  }
  #label { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  #label.err { color: #b00020; max-width: 80vw; text-align: center; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    #disc { background: conic-gradient(from 0deg, #e00 calc(var(--p) * 1%), #3a2222 0); }
    #label.err { color: #ff6b6b; }
  }
</style>
</head>
<body>
<div id="disc" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
<div id="label">0%</div>

<script>
(async function () {
  const PREFIX = "Main.part";   // Main.part01 ... Main.part10
  const COUNT  = 10;
  const disc = document.getElementById("disc");
  const label = document.getElementById("label");

  const list = Array.from({ length: COUNT }, (_, i) => PREFIX + String(i + 1).padStart(2, "0"));
  let done = 0;

  function progress() {
    done++;
    const pct = Math.round((done / COUNT) * 100);
    disc.style.setProperty("--p", pct);
    disc.setAttribute("aria-valuenow", pct);
    label.textContent = pct + "%";
  }

  try {
    // Fetch all parts at once; each success bumps the loader 10%
    const buffers = await Promise.all(list.map(async (name) => {
      const r = await fetch(name, { cache: "no-store" });
      if (!r.ok) throw new Error(name + " failed (HTTP " + r.status + ")");
      const buf = await r.arrayBuffer();
      progress();
      return buf;
    }));

    // Join bytes in order, decode once (safe for splits mid UTF-8 character)
    const total = buffers.reduce((n, b) => n + b.byteLength, 0);
    const all = new Uint8Array(total);
    let off = 0;
    for (const b of buffers) { all.set(new Uint8Array(b), off); off += b.byteLength; }
    const html = new TextDecoder("utf-8").decode(all);

    // Let the full red circle show briefly, then run the rebuilt page
    await new Promise((res) => setTimeout(res, 450));
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    label.classList.add("err");
    label.textContent = err.message + " — serve this folder over http (not file://).";
  }
})();
</script>
</body>
</html>
